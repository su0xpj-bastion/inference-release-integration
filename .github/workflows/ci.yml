name: ci
on:
  pull_request:
  push: {branches: [main]}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m pytest --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: junit, path: reports/}

  presubmit:
    name: presubmit qualification (pairwise, head of main)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - run: python -m rit run --commit 2026.11-rc2 --mode presubmit --fault-rate 0.001 --run-seed ${{ github.run_number }} --out results/presubmit.jsonl
      - name: qualify
        run: |
          python -m rit qualify --release 2026.11-rc2 --baseline-release 2026.10 --mode presubmit \
            --results results/presubmit.jsonl --out reports/presubmit.md > /dev/null
      - if: always()
        run: cat reports/presubmit.md >> "$GITHUB_STEP_SUMMARY" || true
